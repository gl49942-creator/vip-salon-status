<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP Salon Status — 管理員</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f0f0ee;color:#1a1a1a;padding:36px;}
h1{font-size:28px;font-weight:600;margin:0;letter-spacing:.5px;}
.admin-badge{display:inline-block;background:#E1F5EE;border:1px solid #0F6E56;color:#085041;font-size:13px;font-weight:500;padding:4px 12px;border-radius:12px;}
.sync-bar{display:flex;align-items:center;gap:8px;font-size:13px;color:#888;}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#ccc;flex-shrink:0;}
.sync-dot.connected{background:#1D9E75;}
.sync-dot.saving{background:#EF9F27;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* Settings */
.settings-toggle{font-size:13px;color:#378add;cursor:pointer;display:inline-flex;align-items:center;gap:6px;background:none;border:none;font-family:inherit;padding:0;}
.settings-panel{background:#fff;border:1px solid #ddd;border-radius:10px;padding:20px;margin-bottom:24px;display:none;}
.settings-panel.open{display:block;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;}
.settings-section h3{font-size:13px;font-weight:500;color:#555;margin-bottom:10px;}
.slot-row,.store-row,.room-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.slot-row input,.store-row input,.room-row input{flex:1;padding:6px 10px;border:1px solid #ddd;border-radius:6px;font-size:13px;font-family:inherit;}
.del-btn{width:26px;height:26px;border-radius:50%;border:1px solid #ddd;background:#fff;color:#999;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.del-btn:hover{background:#fee;border-color:#E24B4A;color:#E24B4A;}
.add-btn{font-size:12px;color:#378add;background:none;border:1px dashed #378add;border-radius:6px;padding:5px 12px;cursor:pointer;margin-top:4px;font-family:inherit;}
.apply-btn{background:#1F2D45;color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:14px;cursor:pointer;margin-top:16px;font-family:inherit;}
.apply-btn:hover{background:#2a3d5c;}

/* Legend */
.legend-label{font-size:14px;font-weight:500;color:#555;margin-bottom:10px;}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.store-chip{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:500;cursor:grab;user-select:none;border:1.5px solid transparent;}
.store-chip:active{cursor:grabbing;opacity:0.8;}
.actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.action-btn{padding:7px 16px;border:1px solid #D8D6D2;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;color:#444;display:inline-flex;align-items:center;gap:5px;}
.action-btn:hover{background:#f5f5f5;}
.action-btn:first-child{border-radius:8px 0 0 8px;}
.action-group{display:inline-flex;}
.action-group .action-btn{border-radius:0;border-left:none;}
.action-group .action-btn:last-child{border-radius:0 8px 8px 0;}
.btn-export{background:#1F2D45;color:#fff;border-color:#1F2D45;border-radius:8px;margin-right:8px;}
.btn-export:hover{background:#2a3d5c;}
.tip{font-size:12px;color:#aaa;margin-bottom:14px;}

/* Grid */
.grid-wrap{overflow-x:auto;border-radius:12px;border:1px solid #ccc;background:#fff;box-shadow:0 2px 16px rgba(0,0,0,.08);}
table{width:100%;border-collapse:collapse;min-width:1100px;table-layout:fixed;}
thead th{background:#2C3E6B;color:#ffffff;font-size:15px;font-weight:600;letter-spacing:.3px;padding:18px 14px;text-align:center;border-right:1px solid #3d5080;}
thead th:first-child{text-align:center;min-width:150px;border-right:2px solid #3d5080;}
thead th:last-child{border-right:none;}
tbody tr{border-bottom:1px solid #e0e0e0;}
tbody tr:last-child{border-bottom:none;}
tbody tr:nth-child(even){background:#fafafa;}
tbody td{border-right:1px solid #e8e8e8;padding:5px;vertical-align:top;}
tbody td:first-child{padding:8px 14px;background:#EEF1F8;text-align:center;vertical-align:middle;white-space:nowrap;border-right:2px solid #c8cfe0;width:150px;}
tbody td:last-child{border-right:none;}
.slot-label{display:flex;flex-direction:column;align-items:center;gap:4px;}
.slot-time-txt{font-size:15px;font-weight:700;color:#2C3E6B;}
.slot-countdown{font-size:11px;font-weight:500;padding:2px 8px;border-radius:8px;white-space:nowrap;margin-top:1px;}
.sc-active{background:#E1F5EE;color:#085041;}
.sc-warn30{background:#FAEEDA;color:#633806;animation:flashMed 1.8s infinite;}
.sc-warn15{background:#E24B4A;color:#fff;animation:flashSlow 1.2s infinite;}
.sc-ot{background:#A32D2D;color:#fff;animation:flashFast .8s infinite;}
.sc-up{background:#eee;color:#888;}
.sc-done{background:#f0f0f0;color:#bbb;}
@keyframes flashFast{0%,100%{opacity:1;}50%{opacity:.4;}}
@keyframes flashSlow{0%,100%{opacity:1;}50%{opacity:.55;}}
@keyframes flashMed{0%,100%{opacity:1;}50%{opacity:.65;}}
.cell{min-height:130px;border-radius:10px;border:1.5px dashed #ddd;display:flex;align-items:center;justify-content:center;font-size:13px;color:#bbb;transition:background 0.15s;position:relative;}
.cell.drag-over{background:#e8f0fb;border-color:#378add;border-style:solid;}
.cell.filled{border-style:solid;border-color:transparent;}
.assigned{padding:9px 10px;border-radius:8px;width:100%;cursor:grab;position:relative;display:flex;flex-direction:column;gap:3px;}
.assigned:active{cursor:grabbing;}
.store-label{font-size:15px;font-weight:700;display:block;margin-bottom:3px;line-height:1.4;}
.remove-btn{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#E24B4A;color:white;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;border:none;line-height:1;padding:0;}
.return-btn{position:absolute;bottom:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:#1D9E75;color:white;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;border:none;line-height:1;padding:0;font-weight:700;}
.staff-btn{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:#BA7517;color:white;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;border:none;line-height:1;padding:0;}
.client-btn{position:absolute;bottom:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#534AB7;color:white;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;border:none;line-height:1;padding:0;}
.cell:hover .remove-btn,.assigned:hover .remove-btn,
.cell:hover .return-btn,.assigned:hover .return-btn,
.cell:hover .staff-btn,.assigned:hover .staff-btn,
.cell:hover .client-btn,.assigned:hover .client-btn{opacity:1;}
.ret-badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;background:#e0e0e0;color:#888;}
.queue-card{background:#fff;border:1px solid #D0CEC9;border-radius:8px;padding:7px 10px;position:relative;cursor:grab;width:100%;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.queue-slot{width:130px;flex-shrink:0;border-radius:7px;border:1px dashed #C8C6C2;background:#E8E6E2;min-height:76px;position:relative;transition:.15s;cursor:default;}
.queue-slot:not(.filled):hover{border-color:#185FA5;background:#EBF3FC;}
.queue-slot.filled{border:1px solid #D0CEC9;background:#FAFAF9;cursor:grab;box-shadow:0 1px 3px rgba(0,0,0,.06);}
.queue-slot.filled:active{cursor:grabbing;}
.queue-slot.drag-over{border-color:#185FA5 !important;background:#E6F1FB !important;}
.queue-slot-num{font-size:9px;color:#A8A6A2;padding:4px 7px 0;display:block;font-weight:500;}
.queue-slot-empty{font-size:22px;color:#185FA5;text-align:center;padding:12px 4px 2px;line-height:1;}
.queue-num{font-size:9px;font-weight:600;color:#2C3E6B;background:#DDE6F5;padding:1px 5px;border-radius:3px;display:inline-block;margin-bottom:3px;}
.queue-store{font-size:11px;font-weight:600;color:#1F2D45;margin-bottom:2px;line-height:1.3;}
.queue-info{font-size:10px;color:#777;line-height:1.5;}
.queue-del{position:absolute;top:3px;right:3px;width:13px;height:13px;border-radius:50%;background:#ccc;color:#fff;font-size:8px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0;}
.queue-del:hover{background:#E24B4A;}
.queue-card.drag-over-q{background:#E6F1FB;border-color:#185FA5;}
.round-hdr-a{font-size:9px;font-weight:600;letter-spacing:.4px;padding:3px 8px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;}
.round-hdr-a:hover{filter:brightness(.95);}
.round-hdr-a .chv{font-size:9px;transition:transform .2s;}
.round-hdr-a.open .chv{transform:rotate(180deg);}
.r2-add-btn{font-size:10px;padding:2px 8px;border-radius:6px;border:1px dashed #aaa;background:transparent;color:#888;cursor:pointer;margin:4px 8px;width:calc(100% - 16px);font-family:inherit;}
.r2-add-btn:hover{background:#f0f0f0;}
.staff-badge{font-size:12px;opacity:.85;display:block;line-height:1.6;}
.cell-divider-a{border:none;border-top:0.5px solid rgba(0,0,0,.15);margin:3px 0;}
.client-badge{font-size:12px;font-weight:500;color:#3C3489;display:block;line-height:1.6;}
.loan-btn{position:absolute;bottom:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:#0A7C8C;color:white;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:0;transition:opacity 0.15s;border:none;line-height:1;padding:0;}
.cell:hover .loan-btn,.assigned:hover .loan-btn{opacity:1;}
.loan-box{margin-top:9px;padding:4px 6px;border-radius:6px;background:rgba(255,255,255,.65);border:1px dashed rgba(0,0,0,.25);}
.loan-line{font-size:11px;font-weight:600;line-height:1.5;display:block;word-break:break-word;}
.loan-line small{font-weight:400;opacity:.75;}
.loan-line{cursor:pointer;}
.loan-line:hover{background:rgba(10,124,140,.12);border-radius:3px;}
.loan-line.ret{text-decoration:line-through;opacity:.45;}
.loan-line.sold{color:#0F6E56;text-decoration:line-through;opacity:.75;}
.loan-line .sold-tag{display:inline-block;font-size:10px;font-weight:700;background:#0F6E56;color:#fff;border-radius:4px;padding:0 4px;margin-left:3px;}
.loan-sum{display:block;font-size:10px;font-weight:700;color:#A32D2D;margin-bottom:2px;}
.loan-sum.ok{color:#0F6E56;}
.loan-list{border:1px solid #eee;border-radius:8px;margin-bottom:10px;max-height:180px;overflow-y:auto;}
.loan-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:0.5px solid #eee;font-size:13px;}
.loan-item:last-child{border-bottom:none;}
.loan-item .li-main{flex:1;min-width:0;}
.loan-item .li-sku{font-size:11px;color:#888;}
.loan-qty-btn{width:22px;height:22px;border-radius:50%;border:1px solid #ddd;background:#f5f5f5;cursor:pointer;font-size:13px;line-height:1;padding:0;}
.loan-empty{padding:12px;text-align:center;font-size:12px;color:#aaa;}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal-overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;padding:24px;width:320px;box-shadow:0 8px 32px rgba(0,0,0,.18);}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px;}
.modal p{font-size:13px;color:#888;margin-bottom:16px;}
.modal-btns{display:flex;flex-direction:column;gap:8px;}
.ext-opt{padding:10px 16px;border-radius:8px;border:1.5px solid #ddd;background:#fff;font-size:14px;font-weight:500;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;}
.ext-opt:hover{background:#e8f0fb;border-color:#185FA5;color:#0C447C;}
.ext-cancel{padding:9px;border-radius:8px;border:none;background:#f0f0f0;font-size:14px;cursor:pointer;font-family:inherit;margin-top:4px;}
.ext-cancel:hover{background:#e0e0e0;}
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:4px;">
  <h1 style="margin:0;line-height:1;">VIP SALON STATUS</h1>
  <div class="admin-badge">✎ 管理員模式</div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
  <div class="sync-bar"><div class="sync-dot" id="syncDot"></div><span id="syncStatus">連線中...</span></div>
  <button class="settings-toggle" onclick="toggleSettings()">⚙️ 自訂時段 / 包廂 / 店鋪設定</button>
</div>

<div class="settings-panel" id="settingsPanel">
  <div class="settings-grid">
    <div class="settings-section">
      <h3>時段設定</h3><div id="slotList"></div>
      <button class="add-btn" onclick="addSlot()">＋ 新增時段</button>
    </div>
    <div class="settings-section">
      <h3>包廂名稱設定</h3><div id="roomList"></div>
      <button class="add-btn" onclick="addRoom()">＋ 新增包廂</button>
    </div>
    <div class="settings-section">
      <h3>店鋪設定</h3><div id="storeList"></div>
      <button class="add-btn" onclick="addStore()">＋ 新增店鋪</button>
    </div>
  </div>
  <button class="apply-btn" onclick="applySettings()">套用設定並重新產生表格</button>
</div>

<!-- 店鋪列表 + 候位區同一行 -->
<div style="display:flex;align-items:flex-start;gap:16px;margin-bottom:4px;justify-content:space-between;">
  <div style="flex-shrink:0;">
    <div class="legend-label">店鋪列表（拖拉至格子進行分配）</div>
    <div class="legend" id="legend"></div>
    <p class="tip">拖拉店鋪至格子分配；✕ 移除</p>
  </div>
  <!-- 候位區 -->
  <div id="queuePanel" style="flex-shrink:0;background:#EEECEA;border-radius:10px;border:1px solid #D8D6D2;padding:8px 12px;">
    <div style="font-size:13px;font-weight:600;color:#444;margin-bottom:6px;">📋 包廂排隊區</div>
    <div id="queueList" style="display:flex;flex-direction:row;gap:6px;flex-wrap:nowrap;"></div>
  </div>
</div>
<div class="actions">
  <button class="action-btn btn-export" onclick="exportExcel()">📥 匯出報表</button>
  <div class="action-group">
    <button class="action-btn" onclick="clearAll()" style="border-radius:8px 0 0 8px;">✕ 全部清除</button>
    <label class="action-btn" style="cursor:pointer;">
      📂 上傳客人名單
      <input type="file" id="clientExcelInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="loadClientExcel(event)"/>
    </label>
    <button class="action-btn" onclick="clearClientList()" style="border-radius:0 8px 8px 0;">🗑 清除名單</button>
  </div>
  <span id="clientListStatus" style="font-size:12px;color:#888;align-self:center;"></span>
  <div class="action-group">
    <label class="action-btn" style="cursor:pointer;border-radius:8px 0 0 8px;border-left:1px solid #D8D6D2;">
      📦 上傳產品對照表
      <input type="file" id="skuExcelInput" accept=".xlsx,.xls,.csv" style="display:none;" onchange="loadSkuExcel(event)"/>
    </label>
    <button class="action-btn" onclick="clearSkuList()" style="border-radius:0 8px 8px 0;">🗑 清除產品表</button>
  </div>
  <span id="skuListStatus" style="font-size:12px;color:#888;align-self:center;"></span>
</div>

<div class="grid-wrap"><table id="grid"></table></div>

<!-- 候位新增 Modal -->
<div class="modal-overlay" id="queueModal">
  <div class="modal" style="width:400px;">
    <h3>新增候位</h3>
    <p style="font-size:12px;color:#aaa;margin-bottom:14px;">填寫後可拖曳至包廂格子分配</p>

    <div style="margin-bottom:10px;">
      <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">店鋪</label>
      <select id="queueStoreSelect" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;">
        <option value="">-- 選擇店鋪 --</option>
      </select>
    </div>

    <div style="border-top:1px solid #eee;padding-top:10px;margin-bottom:10px;">
      <div style="font-size:11px;font-weight:600;color:#888;letter-spacing:.5px;margin-bottom:8px;">顧客資料</div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">ID <span style="font-size:11px;color:#aaa;">（輸入後自動帶出）</span></label>
        <input id="queueClientId" type="text" placeholder="輸入客人 ID" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;"/>
        <div id="queueSuggestions" style="border:1px solid #ddd;border-top:none;border-radius:0 0 8px 8px;display:none;max-height:130px;overflow-y:auto;background:#fff;position:relative;z-index:10;"></div>
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">姓名</label>
        <input id="queueClientName" type="text" placeholder="客人姓名" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;"/>
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">Segment</label>
        <select id="queueSegment" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;">
          <option value="">-- 請選擇 --</option>
          <option value="Prestige">Prestige</option>
          <option value="VVIC">VVIC</option>
          <option value="VIC">VIC</option>
          <option value="Aspiring Repeaters">Aspiring Repeaters</option>
          <option value="Repeaters">Repeaters</option>
          <option value="One-Timers">One-Timers</option>
          <option value="Promising One-Timers">Promising One-Timers</option>
          <option value="Sleeper">Sleeper</option>
          <option value="Prospect">Prospect</option>
          <option value="New">New</option>
        </select>
      </div>
    </div>

    <div style="border-top:1px solid #eee;padding-top:10px;margin-bottom:14px;">
      <div style="font-size:11px;font-weight:600;color:#888;letter-spacing:.5px;margin-bottom:8px;">服務人員</div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">CA</label>
        <input id="queueCA" type="text" placeholder="CA 姓名" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;"/>
      </div>
    </div>

    <div class="modal-btns">
      <button class="ext-opt" onclick="confirmQueueAdd()" style="text-align:center;background:#1F2D45;color:#fff;border:none;">新增候位</button>
      <button class="ext-cancel" onclick="closeQueueModal()">取消</button>
    </div>
  </div>
</div>

<!-- 合併 Modal：客人資料 + 服務人員 -->
<div class="modal-overlay" id="infoModal">
  <div class="modal" style="width:400px;">
    <h3>填寫包廂資訊</h3>
    <p id="infoModalDesc" style="font-size:13px;color:#888;margin-bottom:14px;"></p>

    <div style="border-bottom:1px solid #eee;padding-bottom:10px;margin-bottom:10px;">
      <div style="font-size:11px;font-weight:600;color:#888;letter-spacing:.5px;margin-bottom:8px;">顧客資料</div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">ID <span style="font-size:11px;color:#aaa;">（輸入後自動帶出）</span></label>
        <input id="clientIdInput" type="text" placeholder="輸入客人 ID" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;"/>
        <div id="clientSuggestions" style="border:1px solid #ddd;border-top:none;border-radius:0 0 8px 8px;display:none;max-height:140px;overflow-y:auto;background:#fff;position:relative;z-index:10;"></div>
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">姓名</label>
        <input id="clientNameInput" type="text" placeholder="輸入客人姓名" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;"/>
      </div>
      <div style="margin-bottom:8px;">
        <label style="font-size:12px;font-weight:500;color:#444;display:block;margin-bottom:4px;">Segment</label>
        <select id="clientSegInput" style="width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:13px;font-family:inherit;outline:none;background:#fff;">

function setSyncStatus(s){
  const dot=document.getElementById('syncDot'),txt=document.getElementById('syncStatus');

}
function push(){
  isSyncing=true;setSyncStatus('saving');
  // queue 存成物件格式以保留 null 位置（Firebase 不保留陣列中的 null）
  const queueObj={};
  queue.forEach((item,i)=>{queueObj[i]=item||null;});
  set(dbRef,{assignments,returned,staff,clients,assignments2,staff2,clients2,returned2,loans,loans2,queue:queueObj,slots:SLOTS,rooms:ROOMS,stores:STORES}).then(()=>{setSyncStatus('connected');isSyncing=false;}).catch(e=>{console.error('push error:',e);isSyncing=false;const dot=document.getElementById('syncDot');dot.className='sync-dot';const t=document.getElementById('syncStatus');t.textContent='⚠ 儲存失敗，請確認網路，或包廂／時段名稱是否含 . # $ / [ ] 等符號';t.style.color='#E24B4A';});
}
onValue(dbRef,snap=>{
  if(isSyncing)return;
  const d=snap.val();if(!d){setSyncStatus('connected');return;}
  if(d.slots?.length)SLOTS=d.slots;
  if(d.rooms?.length)ROOMS=d.rooms;
  if(d.stores?.length)STORES=d.stores;

  clients2=d.clients2||{};
  returned2=d.returned2||{};
  loans=d.loans||{};
  loans2=d.loans2||{};
  // Firebase 不保留 null，讀回來的 queue 可能是物件或稀疏陣列，需要重建
  const rawQueue=d.queue||[];
  queue=Array(QUEUE_SLOTS).fill(null);
  if(Array.isArray(rawQueue)){
    rawQueue.forEach((item,i)=>{if(i<QUEUE_SLOTS&&item)queue[i]=item;});
  }else{
    // Firebase 可能把陣列轉成物件 {0:..., 2:...}
    Object.entries(rawQueue).forEach(([k,v])=>{const i=parseInt(k);if(i<QUEUE_SLOTS&&v)queue[i]=v;});
  }
  setSyncStatus('connected');buildAll();buildQueuePanel();
});

// Settings
window.toggleSettings=()=>{const p=document.getElementById('settingsPanel');p.classList.toggle('open');if(p.classList.contains('open'))renderPanel();};

window.applySettings=()=>{
  const oldSlots=[...SLOTS],oldRooms=[...ROOMS];
  // 依畫面欄位順序讀取（不先過濾空白，避免對應錯位）
  const slotVals=Array.from(document.querySelectorAll('[id^="slot-"]')).map(el=>el.value.trim());
  const roomVals=Array.from(document.querySelectorAll('[id^="room-"]')).map(el=>el.value.trim());
  const bad=[...slotVals,...roomVals].filter(v=>/[.#$\/\[\]]/.test(v));
  if(bad.length){alert('時段／包廂名稱不可包含 . # $ / [ ] 這些符號（系統儲存限制）：\n'+bad.join('、')+'\n\n請改用其他符號，例如「-」或空白。');SLOTS=oldSlots;ROOMS=oldRooms;return;}
  SLOTS=slotVals.filter(Boolean);
  ROOMS=roomVals.filter(Boolean);
  STORES=STORES.map((s,i)=>{const el=document.getElementById(`store-${i}`);return el?{...s,name:el.value.trim()||s.name}:s;}).filter(s=>s.name);

  // 改名對照：依欄位順序，舊名稱 -> 新名稱。已分配的資料會跟著搬到新名稱，不會被清掉
  const roomMap={},slotMap={};
  oldRooms.forEach((o,i)=>{if(o&&roomVals[i]&&roomVals[i]!==o)roomMap[o]=roomVals[i];});
  oldSlots.forEach((o,i)=>{if(o&&slotVals[i]&&slotVals[i]!==o)slotMap[o]=slotVals[i];});
  if(Object.keys(roomMap).length||Object.keys(slotMap).length){
    [assignments,returned,staff,clients,assignments2,staff2,clients2,returned2,loans,loans2].forEach(obj=>{
      const moves=[];
      Object.keys(obj).forEach(k=>{
        const[room,slot]=k.split('||');
        const nr=roomMap[room]||room,ns=slotMap[slot]||slot;
        if(nr!==room||ns!==slot)moves.push([k,key(nr,ns),obj[k]]);
      });
      moves.forEach(m=>delete obj[m[0]]);   // 先全部移除再寫入，避免名稱互換時互相覆蓋
      moves.forEach(m=>{obj[m[1]]=m[2];});
    });
  }
  // 注意：不再刪除「目前畫面上沒有的時段／包廂」的資料。
  // 即使暫時移除某時段或包廂，已分配的資料仍保留，重新加回同名稱就會恢復。

  document.getElementById('settingsPanel').classList.remove('open');

};

function roomStatus(slot,k){
  const p=parseSlot(slot);if(!p)return'upcoming';
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startMs=base.getTime()+(p.startH*60+p.startM)*60*1000;
  const endMs=base.getTime()+(p.endH*60+p.endM)*60*1000;
  if(now.getTime()<startMs)return'upcoming';
  const msToEnd=endMs-now.getTime();
  if(msToEnd<0)return'overtime';
  if(msToEnd<=15*60*1000)return'warn15';
  if(msToEnd<=30*60*1000)return'warn30';
  return'active';
}
function slotStatus(slot){
  const order=['overtime','warn15','warn30','active','upcoming','done'];
  const p=parseSlot(slot);
  if(!p)return'upcoming';
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startMs=base.getTime()+(p.startH*60+p.startM)*60*1000;
  const endMs=base.getTime()+(p.endH*60+p.endM)*60*1000;
  // 還沒開始
  if(now.getTime()<startMs)return'upcoming';
  // 已結束且所有包廂歸還
  if(now.getTime()>endMs){
    const hasUnreturned=ROOMS.some(room=>{
      const k=key(room,slot);
      return (assignments[k]&&!returned[k])||(assignments2[k]&&!returned2[k]);
    });
    if(!hasUnreturned)return'done';
  }
  // 進行中：找最差狀態
  let worst='upcoming';
  ROOMS.forEach(room=>{
    const k=key(room,slot);
    if((assignments[k]&&!returned[k])||(assignments2[k]&&!returned2[k])){
      const st=roomStatus(slot,k);
      if(order.indexOf(st)<order.indexOf(worst))worst=st;
    }
  });
  return worst;
}
function parseSlot(slot){
  const parts=slot.replace(/[–—-]/,'|').split('|');
  if(parts.length<2)return null;
  const[sh,sm]=(parts[0].trim()+':00').split(':').map(Number);
  const[eh,em]=(parts[1].trim()+':00').split(':').map(Number);
  return{startH:sh,startM:sm||0,endH:eh,endM:em||0};
}
function slotTimeStatus(slot){
  const p=parseSlot(slot);if(!p)return{st:'upcoming',mins:null};
  const now=new Date();
  const base=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startMs=base.getTime()+(p.startH*60+p.startM)*60*1000;
  const endMs=base.getTime()+(p.endH*60+p.endM)*60*1000;
  if(now.getTime()<startMs)return{st:'upcoming',mins:null};
  const msToEnd=endMs-now.getTime();
  if(msToEnd<0){
    const si=SLOTS.indexOf(slot);
    const hasUnreturned=ROOMS.some(room=>{
      const k=key(room,slot);
      return assignments[k]&&!returned[k];
    });
    if(!hasUnreturned){
      if(si===SLOTS.length-1)return{st:'done',mins:null}; // 最後場次
      const nextP=parseSlot(SLOTS[si+1]);
      if(nextP){
        const nextStartMs=base.getTime()+(nextP.startH*60+nextP.startM)*60*1000;
        if(now.getTime()>=nextStartMs)return{st:'done',mins:null};
      }
    }
    return{st:'overtime',mins:Math.abs(Math.round(msToEnd/60000))};
  }
  const mins=Math.round(msToEnd/60000);
  if(mins<=15)return{st:'warn15',mins};
  if(mins<=30)return{st:'warn30',mins};
  return{st:'active',mins};
}
function slotCountdownHTML(slot){
  const{st,mins}=slotTimeStatus(slot);
  if(st==='upcoming')return`<span class="slot-countdown sc-up">待開始</span>`;
  if(st==='active')return`<span class="slot-countdown sc-active">進行中 剩 ${mins} 分</span>`;
  if(st==='warn30')return`<span class="slot-countdown sc-warn30">⚠ 剩 ${mins} 分鐘</span>`;
  if(st==='warn15')return`<span class="slot-countdown sc-warn15">⚠ 剩 ${mins} 分鐘</span>`;
  if(st==='overtime')return`<span class="slot-countdown sc-ot">🚨 已超時 ${mins} 分</span>`;
  return`<span class="slot-countdown sc-done">已結束</span>`;
}
function updateSlotLabels(){
  SLOTS.forEach(slot=>{
    const el=document.getElementById(`slotlbl-${encodeURIComponent(slot)}`);
    if(el)el.innerHTML=slotCountdownHTML(slot);
  });
}

const FLOOR_COLOR_MAP={

};

const FLOOR_COLORS=FLOOR_COLOR_MAP;

function buildGrid(){
  const tbl=document.getElementById('grid');
  // 雙行表頭：樓層 + 包廂名稱
  const floorSpans={};
  ROOMS.forEach((_,i)=>{const f=getFloor(i);floorSpans[f]=(floorSpans[f]||0)+1;});
  let floorRow='<tr><th rowspan="2" style="background:#2C3E6B;color:#fff;font-size:14px;font-weight:600;text-align:center;border-right:2px solid #3d5080;vertical-align:middle;padding:10px 14px;">時段 / 包廂</th>';
  let roomRow='<tr>';
  const seenFloors=new Set();
  ROOMS.forEach((room,i)=>{
    const f=getFloor(i);
    const fc=getFloorColor(f);
    if(!seenFloors.has(f)){
      seenFloors.add(f);
      const borderL=i>0?'border-left:2px solid #3d5080;':'';
      floorRow+=`<th colspan="${floorSpans[f]}" style="background:${fc.bg};color:${fc.text};font-size:13px;font-weight:600;padding:8px 6px;text-align:center;${borderL}letter-spacing:.5px;">${f}</th>`;
    }
    const borderL=getFloor(i)!==getFloor(i-1)&&i>0?'border-left:2px solid #3d5080;':'';
    roomRow+=`<th style="background:#2C3E6B;color:#ffffff;font-size:13px;font-weight:600;padding:10px 8px;text-align:center;border-right:0.5px solid #3d5080;${borderL}">${room}</th>`;
  });
  floorRow+='</tr>';roomRow+='</tr>';

  let h=`<thead>${floorRow}${roomRow}</thead><tbody>`;
  const statusOrder={'overtime':0,'warn15':1,'warn30':2,'active':3,'upcoming':4,'done':5};
  const sortedSlots=[...SLOTS].sort((a,b)=>{
    const sa=slotStatus(a),sb=slotStatus(b);
    const oa=statusOrder[sa]??6,ob=statusOrder[sb]??6;
    if(oa!==ob)return oa-ob;
    return SLOTS.indexOf(a)-SLOTS.indexOf(b);
  });
  sortedSlots.forEach(slot=>{
    h+=`<tr><td><div class="slot-label"><span class="slot-time-txt">${slot}</span><span id="slotlbl-${encodeURIComponent(slot)}">${slotCountdownHTML(slot)}</span></div></td>`;
    ROOMS.forEach((room,i)=>{
      const borderL=getFloor(i)!==getFloor(i-1)&&i>0?'border-left:2px solid #c8cfe0;':'';
      h+=`<td style="${borderL}"><div class="cell" data-room="${encodeURIComponent(room)}" data-slot="${encodeURIComponent(slot)}"></div></td>`;
    });
    h+='</tr>';
  });
  tbl.innerHTML=h+'</tbody>';
  document.querySelectorAll('.cell').forEach(cell=>{
    cell.addEventListener('dragover',e=>{e.preventDefault();cell.classList.add('drag-over');});
    cell.addEventListener('dragleave',()=>cell.classList.remove('drag-over'));
    cell.addEventListener('dragenter',e=>e.preventDefault());
    cell.addEventListener('drop',e=>{
      e.preventDefault();cell.classList.remove('drag-over');
      const k=key(decodeURIComponent(cell.dataset.room),decodeURIComponent(cell.dataset.slot));

      // 候位卡片拖曳（優先判斷，不被 dragStore 擋住）
      const qIdx=e.dataTransfer.getData('queueIdx');
      if(qIdx!==''&&qIdx!==undefined&&qIdx!==null){
        const idx=parseInt(qIdx);
        const item=queue[idx];
        if(!item)return;
        assignments[k]=item.storeId;
        delete assignments2[k];delete staff2[k];delete clients2[k];delete returned2[k];delete loans2[k];
        if(item.client&&Object.keys(item.client).length>0)clients[k]=item.client;else delete clients[k];
        if(item.staff&&Object.keys(item.staff).length>0)staff[k]=item.staff;else delete staff[k];
        if(item.loans&&item.loans.length>0)loans[k]=item.loans;else delete loans[k];
        delete returned[k];
        queue[idx]=null;
        buildQueuePanel();render();push();
        return;
      }

      // 一般店鋪或包廂格子拖曳
      if(!dragStore)return;
      if(dragFrom&&dragFrom===k){dragStore=null;dragFrom=null;return;}
      if(dragFrom&&dragFrom!==k){
        // 格子對格子：整格資料（第一輪、第二輪、客人、CA、借出、已還）一起「互換」。
        // 目標格若是空的，就等於搬移；若已有內容，則兩格對調，不會覆蓋任何一邊。
        [assignments,staff,clients,returned,assignments2,staff2,clients2,returned2,loans,loans2].forEach(o=>{
          const hasA=Object.prototype.hasOwnProperty.call(o,dragFrom);
          const hasB=Object.prototype.hasOwnProperty.call(o,k);
          const a=o[dragFrom],b=o[k];
          if(hasB)o[dragFrom]=b;else delete o[dragFrom];
          if(hasA)o[k]=a;else delete o[k];
        });
        dragStore=null;dragFrom=null;render();push();
        return;
      }
      assignments[k]=dragStore;dragStore=null;dragFrom=null;render();push();
    });
  });
}

const itQty=it=>parseInt(it.qty)||1;
const unretQty=arr=>(arr||[]).filter(it=>!it.returned&&!it.sold).reduce((s,it)=>s+itQty(it),0);
const soldQty=arr=>(arr||[]).filter(it=>it.sold).reduce((s,it)=>s+itQty(it),0);
const unretTag=arr=>{const n=unretQty(arr);return n?`｜📦 未還 ${n} 件`:''};
function cellInfoHTML(sid,sfObj,clObj,isRet,k,slot,isR2=false){
  const s=STORES.find(x=>x.id===sid);if(!s)return'';
  const c=color(sid);
  const cParts=[];
  if(clObj.clientId)cParts.push(`<span class="client-badge">ID: ${esc(clObj.clientId)}</span>`);
  if(clObj.clientName)cParts.push(`<span class="client-badge">Name: ${esc(clObj.clientName)}</span>`);
  if(clObj.segment)cParts.push(`<span class="client-badge">Seg: ${esc(clObj.segment)}</span>`);
  const pParts=[];
  if(sfObj.ca)pParts.push(`<span class="staff-badge">CA: ${esc(sfObj.ca)}</span>`);
  const hasC=cParts.length>0,hasP=pParts.length>0;
  const infoLabel=(hasC||hasP)?`${cParts.join('')}${pParts.join('')}`:'';
  const loanArr=(isR2?loans2:loans)[k]||[];
  const keL=k.replace(/'/g,"\\'");
  const unretN=unretQty(loanArr),soldN=soldQty(loanArr);
  const loanHTML=loanArr.length?`<div class="loan-box"><span class="loan-sum ${unretN?'':'ok'}">${unretN?`📦 未還 ${unretN} 件`:(soldN?'✓ 無未還':'✓ 全部已還')}${soldN?`｜💰 已售 ${soldN} 件`:''}</span>${loanArr.map((it,ix)=>`<span class="loan-line ${it.sold?'sold':(it.returned?'ret':'')}" title="點一下切換：未還 → 已還 → 已售" onclick="toggleLoanReturn('${keL}',${isR2?'true':'false'},${ix},event)">${it.sold?'💰':(it.returned?'✓':'📦')} ${esc(it.name||it.sku)}｜${(it.ca||sfObj.ca)?esc(it.ca||sfObj.ca)+'｜':''}×${esc(it.qty||1)}${it.sold?'<span class="sold-tag">已售</span>':''}</span>`).join('')}</div>`:'';
  const retLabel=(isRet?`<span class="ret-badge">已歸還</span>`:'')+loanHTML;
  const retStyle=isRet?'opacity:.5;background:#f5f5f5;border:1.5px solid #ddd;color:#aaa;':'';
  const ke=k.replace(/'/g,"\\'");
  const sname=s.name.replace(/'/g,"\\'");
  const slote=slot.replace(/'/g,"\\'");
  if(isR2){
    return `<div class="assigned" draggable="${isRet?'false':'true'}" style="${retStyle||`background:${c.bg};border:2px solid ${c.border};color:${c.text};`}">
      <span class="store-label" style="${isRet?'color:#aaa;':''}">${s.name}</span>
      ${infoLabel}${retLabel}
      <button class="remove-btn" onclick="removeCell2('${ke}',event)">✕</button>
      <button class="loan-btn" onclick="openLoanModal('${ke}',true,'${sname}','${slote}',event)" title="借出產品">📦</button>
      ${!isRet?`<button class="staff-btn" onclick="openInfoModal2('${ke}','${sname}','${slote}',event)" title="填寫資訊">✏️</button>`:''}
      <button class="return-btn ${isRet?'unreturned':''}" onclick="toggleReturn2('${ke}',event)" title="${isRet?'取消歸還':'標記已歸還'}">${isRet?'↩':'✓'}</button>
    </div>`;
  }
  const guestLabel='';
  return `<div class="assigned" draggable="${isRet?'false':'true'}" style="${retStyle||`background:${c.bg};border:2px solid ${c.border};color:${c.text};`}">
    <span class="store-label" style="${isRet?'color:#aaa;':''}">${s.name}${guestLabel}</span>
    ${infoLabel}${retLabel}
    <button class="remove-btn" onclick="removeCell('${ke}',event)">✕</button>
    <button class="loan-btn" onclick="openLoanModal('${ke}',false,'${sname}','${slote}',event)" title="借出產品">📦</button>
    ${!isRet?`<button class="staff-btn" onclick="openInfoModal('${ke}','${sname}','${slote}',event)" title="填寫資訊">✏️</button>`:''}
    <button class="return-btn ${isRet?'unreturned':''}" onclick="toggleReturn('${ke}',event)" title="${isRet?'取消歸還':'標記已歸還'}">${isRet?'↩':'✓'}</button>
  </div>`;
}

function render(){
  document.querySelectorAll('.cell').forEach(cell=>{
    const room=decodeURIComponent(cell.dataset.room);
    const slot=decodeURIComponent(cell.dataset.slot);
    const k=key(room,slot);
    const sid=assignments[k];
    const sid2=assignments2[k];

    if(!sid&&!sid2){cell.classList.remove('filled');cell.innerHTML='';return;}

    cell.classList.add('filled');
    const isRet=returned[k]||false;
    const isRet2=returned2[k]||false;

    if(sid&&!sid2){
      // 單輪
      const s=STORES.find(x=>x.id===sid);if(!s){delete assignments[k];cell.classList.remove('filled');cell.innerHTML='';return;}
      cell.innerHTML=cellInfoHTML(sid,staff[k]||{},clients[k]||{},isRet,k,slot,false);
      if(!isRet) cell.querySelector('.assigned').addEventListener('dragstart',e=>{dragStore=sid;dragFrom=k;e.dataTransfer.effectAllowed='move';e.stopPropagation();});

      // 第一輪已歸還，顯示「＋第二輪」按鈕
      if(isRet){
        const btn=document.createElement('button');
        btn.className='r2-add-btn';
        btn.textContent='＋ 新增第二輪';
        btn.onclick=(e)=>{e.stopPropagation();openR2StoreSelect(k,slot);};
        cell.appendChild(btn);
      }
      return;
    }

    if(sid&&sid2){
      // 兩輪
      const s1=STORES.find(x=>x.id===sid);
      const s2=STORES.find(x=>x.id===sid2);
      const c2=s2?color(sid2):{bg:'#eee',border:'#ccc',text:'#666'};
      const ke=k.replace(/'/g,"\\'");
      const uid='r'+ROOMS.indexOf(room)+'_'+SLOTS.indexOf(slot);
      const mh=n=>openRounds.has(uid+':'+n)?'500px':'0px';

      const r1mini=`<div class="round-hdr-a" id="h1-${uid}" onclick="toggleRound('${uid}',1)" style="background:#e8e8e8;color:#777;">
        <span>第一輪 · ${s1?s1.name:'?'} · ✓ 已歸還${unretTag(loans[k])}</span><span class="chv">▾</span>
      </div>
      <div id="d1-${uid}" style="overflow:hidden;max-height:${mh(1)};transition:max-height .25s;">
        ${cellInfoHTML(sid,staff[k]||{},clients[k]||{},isRet,k,slot,false)}
      </div>`;

      const r2hdrBg=isRet2?'background:#e8e8e8;color:#777;':`background:${c2.border};color:#fff;`;
      const r2status=isRet2?'✓ 已歸還':'進行中';
      const r2html=`<div class="round-hdr-a" id="h2-${uid}" onclick="toggleRound('${uid}',2)" style="${r2hdrBg}">
        <span>第二輪 · ${s2?s2.name:'?'} · ${r2status}${unretTag(loans2[k])}</span><span class="chv">▾</span>
      </div>
      <div id="d2-${uid}" style="overflow:hidden;max-height:${mh(2)};transition:max-height .25s;">
        ${cellInfoHTML(sid2,staff2[k]||{},clients2[k]||{},isRet2,k,slot,true)}
      </div>`;

      const border=isRet2?'1.5px solid #e0e0e0':`2px solid ${c2.border}`;
      cell.innerHTML=`<div style="border:${border};border-radius:8px;width:100%;overflow:hidden;display:flex;flex-direction:column;">
        ${r1mini}${r2html}
      </div>`;
    }
  });
}

const openRounds=new Set();

  const hdr=document.getElementById(`h${n}-${uid}`);

  const isOpen=det.style.maxHeight!=='0px'&&det.style.maxHeight!=='';

function updateSegmentDropdown(segments){
  const defaults=['Prestige','VVIC','VIC','Aspiring Repeaters','Repeaters','One-Timers','Promising One-Timers','Sleeper','Prospect','New'];
  const all=[...new Set([...defaults,...segments])];
  const sel=document.getElementById('clientSegInput');
  const cur=sel.value;
  sel.innerHTML='<option value="">-- 請選擇 --</option>';
  all.forEach(s=>{
    const opt=document.createElement('option');
    opt.value=s;opt.textContent=s;
    sel.appendChild(opt);
  });
  if(cur)sel.value=cur;
}

  const k=isR2?pendingInfoKey.slice(6):pendingInfoKey;

    if(ca){staff[k]={ca};}else{delete staff[k];}
  }
  closeInfoModal();render();push();
};

// ── Excel 客人名單上傳 ──────────────────────────────
window.loadClientExcel=(e)=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1});

      // 找標頭列（含 Dream ID 或 ID 的那列）
      let headerRow=-1;
      let idCol=-1,lastNameCol=-1,firstNameCol=-1,segCol=-1,caCol=-1,guestCol=-1;
      for(let r=0;r<Math.min(10,data.length);r++){
        const row=data[r]||[];
        const lower=row.map(h=>String(h||'').toLowerCase());
        if(lower.some(h=>h.includes('dream id')||h.includes('dream_id'))){
          headerRow=r;
          lower.forEach((h,i)=>{
            if(h.includes('dream id')||h.includes('dream_id'))idCol=i;
            if(h==='姓氏'||h==='last name'||h==='lastname')lastNameCol=i;
            if(h==='名字'||h==='first name'||h==='firstname')firstNameCol=i;
            if((h.includes('顧客層級')||h==='segment'||h==='seg')&&segCol===-1)segCol=i;
            if((h==='ca名字'||h==='ca name'||h==='ca')&&caCol===-1)caCol=i;
            if((h.includes('幾位友人')||h.includes('友人')||h==='guests'||h==='guest')&&guestCol===-1)guestCol=i;
          });
          break;
        }
      }
      if(headerRow===-1||idCol===-1){
        alert('找不到 Dream ID 欄位，請確認 Excel 格式');return;
      }
      clientList=data.slice(headerRow+1).map(row=>{
        const id=String(row[idCol]||'').trim();
        if(!id||id==='nan'||id==='NaN')return null;
        const lastName=lastNameCol>=0?String(row[lastNameCol]||'').trim():'';
        const firstName=firstNameCol>=0?String(row[firstNameCol]||'').trim():'';
        const name=[lastName,firstName].filter(Boolean).join(' ');
        const segment=segCol>=0?String(row[segCol]||'').trim():'';
        const ca=caCol>=0?String(row[caCol]||'').trim():'';
        const guests=guestCol>=0&&row[guestCol]!==undefined&&row[guestCol]!==''?String(row[guestCol]).trim():'';
        return{id,name,segment,ca,guests};
      }).filter(c=>c&&c.id);

      // 存進 Firebase
      set(clientListRef,clientList).then(()=>{
        const segments=[...new Set(clientList.map(c=>c.segment).filter(Boolean))].sort();
        updateSegmentDropdown(segments);
        document.getElementById('clientListStatus').textContent=`✓ 已載入 ${clientList.length} 位客人（已同步）`;
        document.getElementById('clientListStatus').style.color='#085041';
      });
    }catch(err){alert('讀取失敗，請確認檔案格式');console.error(err);}
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
};

  clientList=[];

  updateSegmentDropdown([]);
};
window.clearAll=()=>{if(confirm('確定要清除所有分配嗎？')){assignments={};returned={};staff={};clients={};assignments2={};staff2={};clients2={};returned2={};loans={};loans2={};queue=Array(QUEUE_SLOTS).fill(null);render();buildQueuePanel();push();}};
// ── Excel 產品 SKU 對照表上傳 ──────────────────────────────
window.loadSkuExcel=(e)=>{
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const data=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      // 找標頭列：含 SKU 的欄位；產品名稱欄位找 產品/品名/名稱/name/description/product
      let headerRow=-1,skuCol=-1,nameCol=-1,fbRow=-1,fbSku=-1;
      for(let r=0;r<Math.min(10,data.length);r++){
        const lower=(data[r]||[]).map(h=>String(h||'').trim().toLowerCase());
        const si=lower.findIndex(h=>h.includes('sku')||h==='款號'||h==='商品編號'||h==='料號');
        if(si<0)continue;
        const ni=lower.findIndex((h,i)=>i!==si&&(h.includes('產品')||h.includes('品名')||h.includes('名稱')||h.includes('name')||h.includes('description')||h.includes('product')||h.includes('描述')));
        if(ni>=0){headerRow=r;skuCol=si;nameCol=ni;break;}   // 同時有 SKU 與名稱欄，優先採用
        if(fbRow<0){fbRow=r;fbSku=si;}
      }
      if(headerRow<0&&fbRow>=0){headerRow=fbRow;skuCol=fbSku;}
      if(headerRow===-1){ // 找不到標頭：假設第一列是標頭、A欄=SKU、B欄=名稱
        headerRow=0;skuCol=0;nameCol=1;
      }
      if(nameCol===-1)nameCol=skuCol===0?1:0;
      const seen=new Set();
      const list=[];
      data.slice(headerRow+1).forEach(row=>{
        const rawSku=row[skuCol];const sku=(typeof rawSku==='number'?rawSku.toLocaleString('fullwide',{useGrouping:false,maximumFractionDigits:6}):String(rawSku==null?'':rawSku)).trim();
        const name=String(row[nameCol]==null?'':row[nameCol]).trim();
        if(!sku||!name)return;
        const n=normSku(sku);
        if(seen.has(n))return;
        seen.add(n);list.push({sku,name});
      });
      if(!list.length){alert('找不到有效的 SKU / 產品名稱資料，請確認 Excel 格式（需有 SKU 與 產品名稱 兩欄）');return;}
      set(skuListRef,list).then(()=>{
        const st=document.getElementById('skuListStatus');
        st.textContent=`✓ 已載入 ${list.length} 個產品（已同步）`;st.style.color='#085041';
      });
    }catch(err){alert('讀取失敗，請確認檔案格式');console.error(err);}
  };
  reader.readAsArrayBuffer(file);
  e.target.value='';
};
window.clearSkuList=()=>{
  if(!confirm('確定要清除產品對照表嗎？（已記錄的借出產品不會被刪除）'))return;
  set(skuListRef,null);
};

// ── 產品借出記錄 ──────────────────────────────
let pendingLoanKey=null,pendingLoanR2=false,loanDraft=[],loanDefaultCa='';
window.openLoanModal=(k,isR2,storeName,slot,e)=>{
  if(e)e.stopPropagation();
  pendingLoanKey=k;pendingLoanR2=!!isR2;
  loanDraft=((isR2?loans2:loans)[k]||[]).map(x=>({...x}));
  const ca=((isR2?staff2:staff)[k]||{}).ca;
  document.getElementById('loanModalDesc').textContent=`${isR2?'[第二輪] ':''}${storeName}　${slot}${ca?`　CA: ${ca}`:''}`;
  loanDefaultCa=ca||'';
  document.getElementById('loanCa').value=loanDefaultCa;
  document.getElementById('loanSku').value='';
  document.getElementById('loanName').value='';
  document.getElementById('loanQty').value='1';
  document.getElementById('loanNameHint').textContent=skuList.length?'':'（尚未上傳產品對照表，請手動輸入）';
  document.getElementById('loanSuggestions').style.display='none';
  renderLoanDraft();
  document.getElementById('loanModal').classList.add('open');
  setTimeout(()=>document.getElementById('loanSku').focus(),100);
};
window.closeLoanModal=()=>{document.getElementById('loanModal').classList.remove('open');pendingLoanKey=null;loanDraft=[];};
function renderLoanDraft(){
  const el=document.getElementById('loanList');
  if(!loanDraft.length){el.innerHTML='<div class="loan-empty">尚未記錄任何借出產品</div>';return;}
  el.innerHTML=loanDraft.map((it,i)=>`<div class="loan-item">
    <label style="display:flex;flex-direction:column;align-items:center;font-size:10px;color:#0F6E56;cursor:pointer;gap:2px;"><input type="checkbox" ${it.returned?'checked':''} onchange="toggleDraftReturn(${i})"/>已還</label>
    <label style="display:flex;flex-direction:column;align-items:center;font-size:10px;color:#B45309;cursor:pointer;gap:2px;"><input type="checkbox" ${it.sold?'checked':''} onchange="toggleDraftSold(${i})"/>已售</label>
    <div class="li-main" style="${it.returned?'text-decoration:line-through;opacity:.5;':(it.sold?'color:#0F6E56;text-decoration:line-through;opacity:.7;':'')}"><div>${esc(it.name||it.sku)}</div><div class="li-sku">${it.sku?'SKU: '+esc(it.sku)+'　':''}出借: ${esc(it.ca||loanDefaultCa||'（未填）')}</div></div>
    <button class="loan-qty-btn" onclick="loanQtyDelta(${i},-1)">－</button>
    <strong style="min-width:18px;text-align:center;">${esc(it.qty)}</strong>
    <button class="loan-qty-btn" onclick="loanQtyDelta(${i},1)">＋</button>
    <button class="del-btn" onclick="removeLoanItem(${i})">✕</button>
  </div>`).join('');
}
// 每件產品三種狀態互斥：未還 / 已還 / 已售
const setLoanState=(it,st)=>{const now=new Date().toISOString();
  it.returned=(st==='ret');it.returnedAt=it.returned?now:'';
  it.sold=(st==='sold');it.soldAt=it.sold?now:'';};
window.toggleDraftReturn=i=>{const it=loanDraft[i];if(!it)return;setLoanState(it,it.returned?'out':'ret');renderLoanDraft();};
window.toggleDraftSold=i=>{const it=loanDraft[i];if(!it)return;setLoanState(it,it.sold?'out':'sold');renderLoanDraft();};
window.toggleLoanReturn=(k,isR2,ix,e)=>{
  if(e)e.stopPropagation();
  const arr=(isR2?loans2:loans)[k];if(!arr||!arr[ix])return;
  const it=arr[ix];
  // 點一下循環：未還 → 已還 → 已售 → 未還
  setLoanState(it,it.sold?'out':(it.returned?'sold':'ret'));
  render();push();
};
window.loanQtyDelta=(i,d)=>{const it=loanDraft[i];if(!it)return;it.qty=Math.max(1,(parseInt(it.qty)||1)+d);renderLoanDraft();};
window.removeLoanItem=i=>{loanDraft.splice(i,1);renderLoanDraft();};
window.addLoanItem=()=>{
  const sku=document.getElementById('loanSku').value.trim();
  const name=document.getElementById('loanName').value.trim();
  const qty=Math.max(1,parseInt(document.getElementById('loanQty').value)||1);
  const ca=document.getElementById('loanCa').value.trim();
  if(!sku&&!name){alert('請輸入 SKU 或產品名稱');return;}
  const same=loanDraft.find(x=>normSku(x.sku)===normSku(sku)&&(x.name||'')===name&&(x.ca||'')===ca&&sku);
  if(same)same.qty=(parseInt(same.qty)||1)+qty;
  else loanDraft.push({sku,name,qty,ca});
  document.getElementById('loanSku').value='';
  document.getElementById('loanName').value='';
  document.getElementById('loanQty').value='1';
  document.getElementById('loanCa').value=loanDefaultCa;
  document.getElementById('loanNameHint').textContent='';
  document.getElementById('loanSuggestions').style.display='none';
  renderLoanDraft();
  document.getElementById('loanSku').focus();
};
window.confirmLoan=()=>{
  if(!pendingLoanKey)return;
  // 輸入框內尚未按「加入清單」的內容，一併加入
  if(document.getElementById('loanSku').value.trim()||document.getElementById('loanName').value.trim())addLoanItem();
  const target=pendingLoanR2?loans2:loans;
  if(loanDraft.length)target[pendingLoanKey]=loanDraft.map(x=>({sku:x.sku||'',name:x.name||'',qty:parseInt(x.qty)||1,ca:x.ca||'',returned:!!x.returned&&!x.sold,returnedAt:(x.returned&&!x.sold?x.returnedAt:'')||'',sold:!!x.sold,soldAt:(x.sold?x.soldAt:'')||''}));
  else delete target[pendingLoanKey];
  closeLoanModal();render();push();
};
window.pickLoanSku=(sku)=>{
  document.getElementById('loanSku').value=sku;
  document.getElementById('loanName').value=skuMap.get(normSku(sku))||'';
  document.getElementById('loanNameHint').textContent='✓ 已自動帶出';
  document.getElementById('loanSuggestions').style.display='none';
  document.getElementById('loanQty').focus();
};
window.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('loanSku');
  if(!inp)return;
  inp.addEventListener('input',function(){
    const raw=this.value.trim();const q=normSku(raw);
    const box=document.getElementById('loanSuggestions');
    const nameEl=document.getElementById('loanName');
    const hint=document.getElementById('loanNameHint');
    if(!q){box.style.display='none';hint.textContent='';return;}
    if(skuMap.has(q)){ // 完全符合：直接帶出名稱
      nameEl.value=skuMap.get(q);hint.textContent='✓ 已自動帶出';
    }else if(skuList.length){
      hint.textContent='（找不到此 SKU，可手動輸入名稱）';
    }
    const matches=skuList.filter(x=>normSku(x.sku).includes(q)&&normSku(x.sku)!==q).slice(0,8);
    if(!matches.length){box.style.display='none';return;}
    box.innerHTML=matches.map(x=>`<div style="padding:7px 12px;cursor:pointer;font-size:12px;border-bottom:0.5px solid #eee;" data-sku="${esc(x.sku)}"><strong>${esc(x.sku)}</strong> ${esc(x.name)}</div>`).join('');
    box.querySelectorAll('[data-sku]').forEach(d=>d.addEventListener('mousedown',ev=>{ev.preventDefault();pickLoanSku(d.dataset.sku);}));
    box.style.display='block';
  });
  inp.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();document.getElementById('loanQty').focus();}});
  document.getElementById('loanQty').addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();addLoanItem();}});
});

// ── 候位排隊 ──────────────────────────────
const QUEUE_SLOTS=5;
let dragQueueIdx=null;

function buildQueuePanel(){
  // 確保永遠有 5 個格子
  if(!Array.isArray(queue))queue=[];
  while(queue.length<QUEUE_SLOTS)queue.push(null);
  queue.length=QUEUE_SLOTS;
  const list=document.getElementById('queueList');
  if(!list)return;
  list.innerHTML='';

  queue.forEach((item,idx)=>{
    const slot=document.createElement('div');
    slot.className='queue-slot'+(item?' filled':'');
    slot.dataset.slotIdx=idx;

    if(item){
      const cl=item.client||{},sf=item.staff||{};
      const guestTxt='';
      slot.draggable=true;
      slot.innerHTML=`
        <div class="queue-card">
          <div class="queue-num">順位 ${idx+1}</div>
          <div class="queue-store">${item.storeName||''}${guestTxt}</div>
          <div class="queue-info">
            ${cl.clientName?`Name: ${esc(cl.clientName)}<br>`:''}
            ${cl.segment?`Seg: ${cl.segment}<br>`:''}
            ${sf.ca?`CA: ${esc(sf.ca)}<br>`:''}
          </div>
          <button class="queue-del" onclick="removeQueue(${idx})">✕</button>
        </div>`;
      slot.addEventListener('dragstart',e=>{
        dragQueueIdx=idx;
        dragStore=null;dragFrom=null;
        e.dataTransfer.setData('queueIdx',String(idx));
        e.dataTransfer.effectAllowed='move';
      });
      slot.addEventListener('dragend',()=>{dragQueueIdx=null;});
    }else{
      slot.style.cursor='pointer';
      slot.innerHTML=`<span class="queue-slot-num">順位 ${idx+1}</span><div class="queue-slot-empty">＋</div>`;
      slot.addEventListener('click',()=>openQueueAddModal(idx));
    }

    slot.addEventListener('dragover',e=>{e.preventDefault();slot.classList.add('drag-over');});
    slot.addEventListener('dragleave',()=>slot.classList.remove('drag-over'));
    slot.addEventListener('drop',e=>{
      e.preventDefault();slot.classList.remove('drag-over');

      // 從另一個候位格子拖來（互換）
      const fromQ=e.dataTransfer.getData('queueIdx');
      if(fromQ!==''){
        const fi=parseInt(fromQ);
        if(fi!==idx){const tmp=queue[fi];queue[fi]=queue[idx];queue[idx]=tmp;buildQueuePanel();push();}
        return;
      }

      // 從包廂格子拖來
      if(dragFrom){
        const storeId=assignments[dragFrom];
        const s=STORES.find(x=>x.id===storeId);
        if(s){
          queue[idx]={storeId,storeName:s.name,client:{...(clients[dragFrom]||{})},staff:{...(staff[dragFrom]||{})},loans:[...(loans[dragFrom]||[])]};
          delete assignments[dragFrom];delete returned[dragFrom];delete staff[dragFrom];delete clients[dragFrom];delete loans[dragFrom];
          dragFrom=null;dragStore=null;
          buildQueuePanel();render();push();
        }
      }
    });
    list.appendChild(slot);
  });
}

window.confirmQueueAdd=()=>{

// ── 匯出報表 ──────────────────────────────
const fmtDT=iso=>{const t=new Date(iso);if(isNaN(t))return'';const p=n=>String(n).padStart(2,'0');return `${t.getFullYear()}-${p(t.getMonth()+1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;};
window.exportExcel=function(){
  const today=new Date();
  const dateStr=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  const todayData={slots:SLOTS,rooms:ROOMS,stores:STORES,assignments,staff,returned,clients,assignments2,staff2,returned2,clients2,loans,loans2,savedAt:new Date().toISOString()};
  if(typeof XLSX==='undefined'){alert('報表套件載入中，請稍後再試');return;}
  set(ref(db,`history/${dateStr}`),todayData).then(()=>{
    get(ref(db,'history')).then(snap=>{
      const history=snap.val()||{};
      const wb=XLSX.utils.book_new();
      const dates=Object.keys(history).sort();
      const rows=[['日期','時段','包廂','輪次','店鋪','客人ID','客人姓名','Segment','CA','已歸還']];
      const loanRows=[['日期','時段','包廂','輪次','店鋪','產品名稱','出借CA','數量','SKU','狀態','歸還／售出時間']];
      dates.forEach(date=>{
        const d=history[date];if(!d)return;
        const slotList=d.slots||[],roomList=d.rooms||[],storeList=d.stores||[];
        const asgn=d.assignments||{},sfData=d.staff||{},retData=d.returned||{};
        const asgn2=d.assignments2||{},sfData2=d.staff2||{},retData2=d.returned2||{};
        let dateShown=false;
        slotList.forEach(slot=>{
          let slotShown=false;
          roomList.forEach(room=>{
            const k=`${room}||${slot}`;
            const sid=asgn[k];
            const sid2=asgn2[k];
            if(!sid&&!sid2)return;
            const pushLoans=(round,sId,sfObj,arr)=>{
              const st=storeList.find(x=>x.id===sId);
              (arr||[]).forEach(it=>loanRows.push([date,slot,room,round,st?st.name:'',it.name||'',it.ca||(sfObj||{}).ca||'',it.qty||1,it.sku||'',it.sold?'已售':(it.returned?'已歸還':'未歸還'),it.sold?(it.soldAt?fmtDT(it.soldAt):''):(it.returned&&it.returnedAt?fmtDT(it.returnedAt):'')]));
            };
            if(sid)pushLoans('第一輪',sid,sfData[k],(d.loans||{})[k]);
            if(sid2)pushLoans('第二輪',sid2,sfData2[k],(d.loans2||{})[k]);
            // 第一輪
            if(sid){
              const s=storeList.find(x=>x.id===sid);
              const sfInfo=sfData[k]||{};
              const clInfo=(d.clients||{})[k]||{};
              const retVal=retData[k]?'✓':'';
              rows.push([dateShown?'':date,slotShown?'':slot,room,'第一輪',s?s.name:'',clInfo.clientId||'',clInfo.clientName||'',clInfo.segment||'',sfInfo.ca||'',retVal]);
              dateShown=true;slotShown=true;
            }
            // 第二輪
            if(sid2){
              const s2=storeList.find(x=>x.id===sid2);
              const sfInfo2=sfData2[k]||{};
              const clInfo2=(d.clients2||{})[k]||{};
              const retVal2=retData2[k]?'✓':'';
              rows.push([dateShown?'':date,slotShown&&sid?'':slot,room,'第二輪',s2?s2.name:'',clInfo2.clientId||'',clInfo2.clientName||'',clInfo2.segment||'',sfInfo2.ca||'',retVal2]);
              dateShown=true;slotShown=true;
            }
          });
        });
        if(dateShown)rows.push([]);
      });
      if(rows.length<=1){alert('尚無資料可匯出');return;}
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:12},{wch:18},{wch:10},{wch:8},{wch:10},{wch:12},{wch:12},{wch:10},{wch:12},{wch:8}];
      ws['!freeze']={xSplit:0,ySplit:1};
      XLSX.utils.book_append_sheet(wb,ws,'VIP Salon 全期紀錄');
      if(loanRows.length>1){
        const wsL=XLSX.utils.aoa_to_sheet(loanRows);
        wsL['!cols']=[{wch:12},{wch:18},{wch:10},{wch:8},{wch:10},{wch:32},{wch:14},{wch:6},{wch:14},{wch:10},{wch:18}];
        XLSX.utils.book_append_sheet(wb,wsL,'借出產品明細');
      }
      XLSX.writeFile(wb,'VIP_Salon_全期報表.xlsx');
    });
  }).catch(err=>{alert('儲存失敗，請確認網路連線');console.error(err);});
};
